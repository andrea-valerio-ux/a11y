# Nginx in front of the scanner, which listens on 127.0.0.1:4173 only.
# Install as /etc/nginx/sites-available/scan.andryta.com and link it into
# sites-enabled (deploy/install-ubuntu.sh does this). Certbot adds the HTTPS
# server block and the redirect from port 80 when you run it.
#
# Two lines matter more than the rest:
#   proxy_set_header Origin   the app refuses any Origin that is not its own
#                             loopback address, so the proxy presents that one.
#   proxy_buffering off       progress during a scan is a server-sent event
#                             stream; buffered, it would arrive all at once.

server {
    listen 80;
    listen [::]:80;
    server_name scan.andryta.com;

    # Reports can be large (Excel with screenshots, PDF).
    client_max_body_size 2m;

    # Optional: ask for a user name and password before anything else.
    # The scanner itself has no sign-in; anyone who can open this address can
    # start a scan. To turn this on, create the file with
    #   sudo htpasswd -c /etc/nginx/.a11y-htpasswd <username>
    # and remove the # from the next two lines.
    # auth_basic "Accessibility Checklist Scanner";
    # auth_basic_user_file /etc/nginx/.a11y-htpasswd;

    location / {
        proxy_pass http://127.0.0.1:4173;
        proxy_http_version 1.1;

        # Present the app's own origin, whatever the browser sent.
        proxy_set_header Origin http://127.0.0.1:4173;
        proxy_set_header Host 127.0.0.1:4173;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Server-sent events and long scans.
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # Keep search engines away from the tool and the reports.
    add_header X-Robots-Tag "noindex, nofollow" always;
}
