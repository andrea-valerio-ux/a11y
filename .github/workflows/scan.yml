# One scan per run. Started by web/api.php on andryta.com (or by hand from the
# Actions tab), it scans the site with the command-line tool, builds the six
# reports and uploads them to the website's runs/ folder over FTP or SFTP.
#
# Secrets (repository Settings → Secrets and variables → Actions):
#   FTP_HOST       ftp.andryta.com or the server's host name / IP
#   FTP_USER       an FTP account whose home is public_html/technology/a11y/runs
#   FTP_PASSWORD   its password
# Optional:
#   FTP_PROTOCOL   ftp (default, upgraded to TLS) or sftp
#   FTP_PORT       21 for ftp (default), 2222 for HostGator sftp
#   FTP_DIR        folder inside the account to write to (default: its home, ".")
#   FTP_VERIFY     yes to insist on a valid TLS certificate (default: no; shared
#                  hosts usually present the server's own certificate)
name: Scan
run-name: "Scan ${{ inputs.url }} · ${{ inputs.request_id }}"

on:
  workflow_dispatch:
    inputs:
      url:
        description: Web address to scan
        required: true
        type: string
      pages:
        description: How many pages to discover and scan (1 to 10)
        default: "1"
        type: string
      widths:
        description: Viewport widths, comma separated
        default: "1440,390"
        type: string
      level:
        description: Conformance level, AA or AAA
        default: AA
        type: string
      request_id:
        description: Id given by the web form (leave as is when starting by hand)
        default: manual
        type: string
      client:
        description: Name for the run folder (default, the site's host name)
        default: ""
        type: string

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      URL: ${{ inputs.url }}
      PAGES: ${{ inputs.pages }}
      WIDTHS: ${{ inputs.widths }}
      LEVEL: ${{ inputs.level }}
      REQUEST_ID: ${{ inputs.request_id }}
      CLIENT: ${{ inputs.client }}
      # The upload step is skipped when no FTP host is configured (the report
      # is then only kept as a workflow artifact).
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USER: ${{ secrets.FTP_USER }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FTP_PROTOCOL: ${{ secrets.FTP_PROTOCOL }}
      FTP_PORT: ${{ secrets.FTP_PORT }}
      FTP_DIR: ${{ secrets.FTP_DIR }}
      FTP_VERIFY: ${{ secrets.FTP_VERIFY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install the scanner's dependency
        run: npm ci --omit=dev --no-audit --no-fund

      - name: Install Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Check the machine
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          node bin/a11y.js doctor
          # Which website settings reached this run (names only, never values).
          {
            echo "### Website upload settings"
            for v in FTP_HOST FTP_USER FTP_PASSWORD; do
              if [ -n "$(eval echo "\$$v")" ]; then echo "- $v: set"; else echo "- $v: **missing** (add it under Settings → Secrets and variables → Actions → Repository secrets)"; fi
            done
            echo
          } >> "$GITHUB_STEP_SUMMARY"

      # The practice page ships with the scanner (test/fixture). When that is the
      # target, the scanner's own app serves it on this machine for the scan.
      - name: Serve the practice page
        if: ${{ startsWith(inputs.url, 'http://127.0.0.1:4173/') }}
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          nohup node bin/a11y.js ui --no-open --port 4173 --runs /tmp/practice-runs > /tmp/practice-ui.log 2>&1 &
          for i in $(seq 1 30); do curl -sf -o /dev/null http://127.0.0.1:4173/ping && break; sleep 1; done
          curl -sf -o /dev/null http://127.0.0.1:4173/demo/ && echo "The practice page is being served on this machine."

      - name: Scan
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        # Same scan as `a11y scan`, plus a progress file published to the site
        # every few seconds so the page can show pages, widths and topics live.
        run: node scripts/ci/scan-live.js

      - name: Build the reports
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: node bin/a11y.js report run

      - name: Prepare the upload folder
        run: node scripts/ci/prepare-upload.js run upload "$REQUEST_ID" "$CLIENT" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload to the website
        if: ${{ env.FTP_HOST != '' }}
        # One curl call per file: explicit, and the step fails if any file does not land.
        run: |
          set -euo pipefail
          PROTO="${FTP_PROTOCOL:-ftp}"
          PORT="${FTP_PORT:-21}"
          DIR="${FTP_DIR:-.}"; DIR="${DIR#.}"; DIR="${DIR#/}"; DIR="${DIR%/}"; [ -n "$DIR" ] && DIR="$DIR/"
          OPTS=(-sS --fail --retry 3 --retry-delay 2 --connect-timeout 30 -u "$FTP_USER:$FTP_PASSWORD")
          [ "${FTP_VERIFY:-no}" = "yes" ] || OPTS+=(-k)
          [ "$PROTO" = "ftp" ] && OPTS+=(--ssl-reqd)
          BASE="$PROTO://$FTP_HOST:$PORT/$DIR"
          n=0
          while IFS= read -r -d '' f; do
            rel="${f#upload/}"
            curl "${OPTS[@]}" --ftp-create-dirs -T "$f" "$BASE$rel"
            echo "  uploaded $rel"
            n=$((n + 1))
          done < <(find upload -type f -print0)
          # The live-progress file has done its job.
          curl "${OPTS[@]}" -Q "DELE ${DIR}_progress/$REQUEST_ID.json" -o /dev/null "$PROTO://$FTP_HOST:$PORT/" || true
          # Prove the report folder is there by listing it.
          FOLDER="$(dirname "$(find upload -name meta.json | head -1)")"; FOLDER="${FOLDER#upload/}"
          echo "Remote listing of $FOLDER:"
          curl "${OPTS[@]}" --list-only "$BASE$FOLDER/"
          echo "Uploaded $n files to $FTP_HOST/$DIR$FOLDER" >> "$GITHUB_STEP_SUMMARY"

      - name: Keep a copy for a week
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-${{ inputs.request_id }}
          path: upload
          retention-days: 7
          if-no-files-found: ignore
